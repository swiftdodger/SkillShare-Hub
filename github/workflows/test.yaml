name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04   # was ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4   # keep major, avoid @v4.1.2 etc. unless you want full pin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'    # explicit, not default/latest

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest==8.3.3

      - name: Run tests
        run: |
          pytest -q || pytest
