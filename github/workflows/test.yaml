name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          # Ensure pytest, pytest-django and Django itself are installed
          pip install pytest==8.3.3 pytest-django==4.9.0

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: LearningPlatform.settings.prod
        run: |
          python -m pytest -q